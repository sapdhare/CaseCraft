name: casecraft
version: 1.0.0+1
description: CaseCraft — a polished offline-first legal practice command centre for iOS and Android.
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  hive_ce: ^2.20.0
  hive_ce_flutter: ^2.3.4
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  intl: ^0.20.3
  uuid: ^4.5.1
  file_picker: ^13.0.0
  path_provider: ^2.1.5
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
